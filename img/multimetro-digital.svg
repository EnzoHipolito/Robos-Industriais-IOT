<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="corpoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="painelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lcdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3b899"/>
      <stop offset="100%" stop-color="#8fa385"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Carcaça externa emborrachada amarela -->
  <rect x="130" y="40" width="340" height="580" rx="36" fill="url(#corpoGrad)" stroke="#b45309" stroke-width="4" filter="url(#sombra)"/>
  
  <!-- Painel frontal escuro -->
  <rect x="155" y="65" width="290" height="530" rx="24" fill="url(#painelGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Marca / Modelo fictício -->
  <text x="180" y="105" fill="#f8fafc" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">MULTÍMETRO DIGITAL DMM-400</text>
  <text x="180" y="122" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">CAT III 600V • TRUE RMS</text>

  <!-- Display LCD -->
  <rect x="180" y="135" width="240" height="85" rx="8" fill="url(#lcdGrad)" stroke="#475569" stroke-width="3"/>
  <rect x="185" y="140" width="230" height="75" rx="5" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Indicadores no LCD -->
  <text x="195" y="160" fill="#2d3748" font-family="'Courier New', monospace" font-size="12" font-weight="bold">DC</text>
  <text x="385" y="160" fill="#2d3748" font-family="'Courier New', monospace" font-size="12" font-weight="bold">AUTO</text>
  <!-- Dígitos de 7 segmentos simulados -->
  <text x="290" y="200" fill="#1a202c" font-family="'Courier New', monospace" font-size="44" font-weight="bold" text-anchor="middle">5.00</text>
  <text x="390" y="198" fill="#1a202c" font-family="Arial, sans-serif" font-size="24" font-weight="bold">V</text>

  <!-- Botão Power / Hold -->
  <circle cx="205" cy="245" r="14" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <text x="205" y="249" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ON</text>
  
  <rect x="360" y="233" width="50" height="24" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="385" y="249" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HOLD</text>

  <!-- SELETOR ROTATIVO (DIAL) -->
  <circle cx="300" cy="355" r="85" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="300" cy="355" r="60" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  <circle cx="300" cy="355" r="52" fill="#0f172a"/>
  
  <!-- Ranhuras do seletor -->
  <line x1="300" y1="298" x2="300" y2="412" stroke="#334155" stroke-width="2"/>
  <line x1="245" y1="355" x2="355" y2="355" stroke="#334155" stroke-width="2"/>

  <!-- Indicador / Ponta do Seletor apontando para DCV (V⎓ 20V) na faixa de ~10h30 (aprox -50 graus) -->
  <g transform="rotate(-48, 300, 355)">
    <!-- Marca branca em relevo no knob -->
    <rect x="296" y="296" width="8" height="30" rx="3" fill="#ffffff"/>
    <polygon points="300,288 293,302 307,302" fill="#ef4444"/>
  </g>

  <!-- ESCALAS AO REDOR DO SELETOR -->
  <!-- Setor Tensão Contínua (DCV - V⎓) no quadrante superior esquerdo (Destacado) -->
  <path d="M 230 290 A 95 95 0 0 1 300 255" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <text x="215" y="270" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">V⎓ (DC)</text>
  <text x="210" y="300" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">200m</text>
  <text x="235" y="280" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">2000m</text>
  <text x="270" y="266" fill="#fde047" font-family="Arial, sans-serif" font-size="12" font-weight="bold">20V ▶</text>
  <text x="315" y="266" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">200V</text>
  <text x="350" y="278" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">600V</text>

  <!-- Setor Tensão Alternada (ACV - V~) no quadrante superior direito -->
  <text x="380" y="305" fill="#f43f5e" font-family="Arial, sans-serif" font-size="13" font-weight="bold">V~ (AC)</text>
  <text x="380" y="325" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">600V</text>
  <text x="385" y="348" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">200V</text>

  <!-- Setor Corrente Contínua (DCA - A⎓) no quadrante inferior direito -->
  <text x="375" y="415" fill="#fde047" font-family="Arial, sans-serif" font-size="13" font-weight="bold">A⎓ (DCA)</text>
  <text x="370" y="380" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">10A</text>
  <text x="365" y="435" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">200m</text>
  <text x="345" y="450" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">20m</text>

  <!-- Continuidade e Resistência (Ω) no quadrante inferior esquerdo -->
  <text x="180" y="420" fill="#4ade80" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Ω (Resist.)</text>
  <text x="215" y="445" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">200Ω</text>
  <text x="195" y="390" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">2k</text>
  <text x="185" y="360" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">20k</text>
  <text x="190" y="335" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">200k</text>
  <text x="240" y="455" fill="#4ade80" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🔔/Diodo</text>

  <!-- BORNES DE ENTRADA (JACKS) NA PARTE INFERIOR -->
  <!-- Borne 10A (Esquerda) -->
  <g transform="translate(200, 520)">
    <circle cx="0" cy="0" r="20" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a"/>
    <circle cx="0" cy="0" r="8" fill="#ef4444"/>
    <text x="0" y="32" fill="#ef4444" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">10A MAX</text>
    <text x="0" y="44" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">FUSED</text>
  </g>

  <!-- Borne COM (Centro) - CONECTADO com ponta preta -->
  <g transform="translate(300, 520)">
    <circle cx="0" cy="0" r="20" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a"/>
    <circle cx="0" cy="0" r="8" fill="#000000" stroke="#334155" stroke-width="1"/>
    <!-- Plugue banana preto inserido -->
    <rect x="-8" y="-12" width="16" height="24" rx="4" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
    <text x="0" y="32" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">COM</text>
    <text x="0" y="44" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">▲ COMUM (-)</text>
  </g>

  <!-- Borne VΩmA (Direita) - CONECTADO com ponta vermelha -->
  <g transform="translate(400, 520)">
    <circle cx="0" cy="0" r="20" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a"/>
    <circle cx="0" cy="0" r="8" fill="#dc2626"/>
    <!-- Plugue banana vermelho inserido -->
    <rect x="-8" y="-12" width="16" height="24" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <text x="0" y="32" fill="#ef4444" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">V Ω mA</text>
    <text x="0" y="44" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">600V MAX (+)</text>
  </g>

  <!-- CABOS DAS PONTAS DE PROVA -->
  <!-- Cabo Preto saindo do COM -->
  <path d="M 300 532 C 300 580, 250 630, 150 660" fill="none" stroke="#18181b" stroke-width="6" stroke-linecap="round"/>
  <!-- Ponteira Preta -->
  <rect x="70" y="650" width="80" height="14" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  <polygon points="70,657 40,657" stroke="#71717a" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="682" fill="#0f172a" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ponta Preta (-)</text>

  <!-- Cabo Vermelho saindo de VΩmA -->
  <path d="M 400 532 C 400 580, 450 630, 520 660" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <!-- Ponteira Vermelha -->
  <rect x="450" y="650" width="80" height="14" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
  <polygon points="530,657 560,657" stroke="#71717a" stroke-width="3" stroke-linecap="round"/>
  <text x="490" y="682" fill="#dc2626" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ponta Vermelha (+)</text>

</svg>
